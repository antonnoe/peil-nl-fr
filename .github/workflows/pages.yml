name: Peil bouwen en publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Bouwen en testen. Dit is de eigenlijke controle en hoort altijd groen te staan.
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Afleiden uit de bronbestanden
        run: npm run afleiden
      - name: Controleren dat de afleiding niets wijzigt
        run: |
          if [ -n "$(git status --porcelain data peil)" ]; then
            echo "De afgeleide bestanden lopen uit de pas met tools/bron/."
            git --no-pager diff --stat data peil
            exit 1
          fi
      - name: Bouwen
        run: npm run bouw
      - name: Testen
        run: npm test
      - name: Bouwresultaat bewaren
        uses: actions/upload-artifact@v4
        with:
          name: peil-dist
          path: dist
          retention-days: 7

  # Publiceren naar GitHub Pages.
  #
  # Dit lukt pas nadat Pages voor de repo aanstaat. De eigenaar zet dat eenmalig:
  # Settings, Pages, Build and deployment, Source: GitHub Actions.
  # De workflow kan het niet zelf: het GITHUB_TOKEN van Actions mag geen Pages-site
  # aanmaken, en actions/configure-pages met enablement: true geeft dan
  # "Resource not accessible by integration".
  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bouwen
        run: npm run bouw
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: publicatie
        uses: actions/deploy-pages@v4
